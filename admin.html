<style>
*{
    box-sizing:border-box;

    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;

.topbar{
    background:#087f8c;

.topbar-inner{

    display:flex;

    align-items:center;

}

.logo{
    display:flex;
    align-items:center;

}

.logo-icon{
    font-size:32px;

.logo h1{
    font-size:22px;

.logo span{

.home-btn{
    color:white;

    border:1px solid rgba(255,255,255,.5);
    padding:9px 14px;
    border-radius:8px;

.container{

.page-title{
    margin-bottom:22px;

.page-title h2{
    font-size:28px;

.page-title p{

    display:grid;

    font-size:28px;

    color:#667085;

.toolbar{
    background:white;
    padding:16px;
    border-radius:14px;
    margin-bottom:20px;

    outline:none;

.bookings{
    display:grid;

.booking-card{
    background:white;

    display:flex;
    justify-content:space-between;

    font-size:18px;

    color:#667085;

    margin-top:5px;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;

}

    background:#fff4cc;

}

.status-Confirmed{
    background:#dff4ff;
    color:#006b8f;
}

    background:#dcfce7;

}

    font-size:45px;
    margin-bottom:10px;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .booking-grid{
        grid-template-columns:1fr;
    }

}

    .topbar-inner{
        align-items:flex-start;
    }

    .logo h1{
        font-size:18px;
    }

    .home-btn{
        font-size:12px;
        padding:8px 10px;
    }

    .container{
        padding:20px 12px 40px;
    }

    .page-title h2{
        font-size:23px;

    .stats{
        gap:10px;

    .stat-card{
        padding:15px;
    }

    .stat-card h3{
        font-size:23px;
    }

    .booking-top{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <div class="logo">

            <div class="logo-icon">❄️</div>

            <div>
                <h1>Smart Cool</h1>
                <span>Admin Dashboard</span>
            </div>

        </div>

        <a href="index.html" class="home-btn">
            ← Website
        </a>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h2>📊 Booking Dashboard</h2>

        <p>
            Smart Cool & Refrigerator — Customer Service Bookings
        </p>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3 id="totalBookings">0</h3>

            <p>Total Bookings</p>

        </div>


        <div class="stat-card">

            <h3 id="pendingBookings">0</h3>

            <p>Pending</p>

        </div>


        <div class="stat-card">

            <h3 id="confirmedBookings">0</h3>

            <p>Confirmed</p>

        </div>


        <div class="stat-card">

            <h3 id="completedBookings">0</h3>

            <p>Completed</p>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search Tracking ID, name, phone, service..."
                oninput="renderBookings()"
            >

        </div>


        <div class="filter">

            <select
                id="statusFilter"
                onchange="renderBookings()"
            >

                <option value="All">All Status</option>

                <option value="Pending">Pending</option>

                <option value="Confirmed">Confirmed</option>

                <option value="Completed">Completed</option>

                <option value="Cancelled">Cancelled</option>

            </select>

        </div>

    </div>


    <!-- BOOKINGS -->

    <div id="bookingsContainer" class="bookings"></div>

</main>


<script>

/* =========================
   GET BOOKINGS
========================= */

function getBookings(){

    return JSON.parse(
        localStorage.getItem("smartCoolBookings")
    ) || [];

}


/* =========================
   SAVE BOOKINGS
========================= */

function saveBookings(bookings){

    localStorage.setItem(
        "smartCoolBookings",
        JSON.stringify(bookings)
    );

}


/* =========================
   DASHBOARD STATS
========================= */

function updateStats(bookings){

    document.getElementById("totalBookings").textContent =
        bookings.length;

    document.getElementById("pendingBookings").textContent =
        bookings.filter(b => b.status === "Pending").length;

    document.getElementById("confirmedBookings").textContent =
        bookings.filter(b => b.status === "Confirmed").length;

    document.getElementById("completedBookings").textContent =
        bookings.filter(b => b.status === "Completed").length;

}


/* =========================
   RENDER BOOKINGS
========================= */

function renderBookings(){

    const bookings = getBookings();

    updateStats(bookings);

    const container =
        document.getElementById("bookingsContainer");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById("statusFilter")
        .value;


    let filtered = bookings.filter(function(booking){

        const searchable = [

            booking.trackingId,
            booking.customerName,
            booking.phone,
            booking.service,
            booking.area,
            booking.problem

        ]
        .join(" ")
        .toLowerCase();


        const matchesSearch =
            searchable.includes(search);


        const matchesStatus =
            filter === "All" ||
            booking.status === filter;


        return matchesSearch && matchesStatus;

    });


    /* NEWEST FIRST */

    filtered.reverse();


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">📭</div>

                <h3>No Bookings Found</h3>

                <p>
                    Customer bookings will appear here
                    after they submit the booking form.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = filtered.map(function(booking){

        return `

        <div class="booking-card">

            <div class="booking-top">

                <div>

                    <div class="booking-id">
                        🆔 ${escapeHtml(booking.trackingId)}
                    </div>

                    <div class="booking-date">
                        Created:
                        ${formatDate(booking.createdAt)}
                    </div>

                </div>


                <span class="status status-${escapeHtml(booking.status)}">
                    ${escapeHtml(booking.status)}
                </span>

            </div>


            <div class="booking-grid">

                <div class="info-box">

                    <small>Customer</small>

                    <strong>
                        👤 ${escapeHtml(booking.customerName)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>Phone</small>

                    <strong>
                        📞 ${escapeHtml(booking.phone)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>Service</small>

                    <strong>
                        🔧 ${escapeHtml(booking.service)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>Area</small>

                    <strong>
                        📍 ${escapeHtml(booking.area)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>Preferred Date</small>

                    <strong>
                        📅 ${escapeHtml(booking.preferredDate || "Not specified")}
                    </strong>

                </div>


                <div class="info-box">

                    <small>Preferred Time</small>

                    <strong>
                        🕐 ${escapeHtml(booking.preferredTime || "Not specified")}
                    </strong>

                </div>

            </div>


            <div class="problem">

                <small>Problem Details</small>

                <strong>
                    ${escapeHtml(booking.problem || "No details provided")}
                </strong>

            </div>


            <div class="actions">

                <select
                    onchange="changeStatus('${escapeJs(booking.trackingId)}', this.value)"
                >

                    <option value="Pending"
                        ${booking.status === "Pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Confirmed"
                        ${booking.status === "Confirmed" ? "selected" : ""}>
                        Confirmed
                    </option>

                    <option value="Completed"
                        ${booking.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                    <option value="Cancelled"
                        ${booking.status === "Cancelled" ? "selected" : ""}>
                        Cancelled
                    </option>

                </select>


                <button
                    class="btn whatsapp-btn"
                    onclick="openWhatsApp('${escapeJs(booking.phone)}')"
                >
                    💬 WhatsApp
                </button>


                <button
                    class="btn delete-btn"
                    onclick="deleteBooking('${escapeJs(booking.trackingId)}')"
                >
                    🗑️ Delete
                </button>

            </div>

        </div>

        `;

    }).join("");

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(trackingId, newStatus){

    const bookings = getBookings();

    const booking =
        bookings.find(
            b => b.trackingId === trackingId
        );


    if(!booking){
        return;
    }


    booking.status = newStatus;

    saveBookings(bookings);

    renderBookings();

}


/* =========================
   DELETE BOOKING
========================= */

function deleteBooking(trackingId){

    const confirmDelete =
        confirm(
            "Kya aap is booking ko delete karna chahte hain?"
        );


    if(!confirmDelete){
        return;
    }


    let bookings = getBookings();


    bookings = bookings.filter(
        b => b.trackingId !== trackingId
    );


    saveBookings(bookings);

    renderBookings();

}


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(phone){

    let number =
        phone.replace(/\D/g, "");


    if(number.startsWith("03")){

        number =
            "92" + number.substring(1);

    }


    window.open(
        "https://wa.me/" + number,
        "_blank"
    );

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(date){

    if(!date){
        return "Unknown";
    }


    try{

        return new Date(date).toLocaleString(
            "en-PK",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch(error){

        return date;

    }

}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    if(value === null || value === undefined){
        return "";
    }


    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"');

}


/* =========================
   START DASHBOARD
========================= */

renderBookings();


/* =========================
   AUTO REFRESH
========================= */

setInterval(function(){

    renderBookings();

},3000);

</script>

</body>
</html>
