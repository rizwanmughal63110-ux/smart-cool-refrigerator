<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Cool - Owner Panel</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div id="login" class="booking-card" style="max-width:430px"><div class="section-head"><div class="eyebrow">OWNER PANEL</div><h2>Smart Cool <span>Admin</span></h2></div><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn" class="btn primary full-btn">Login</button><p id="msg"></p></div><div id="dash" class="hidden"><div class="section-head"><div class="eyebrow">OWNER DASHBOARD</div><h2>Service <span>Requests</span></h2></div><div class="trust-cards"><div><b>Total</b><span id="total">0</span></div><div><b>Pending</b><span id="pending">0</span></div><div><b>Completed</b><span id="completed">0</span></div></div><div id="requests" style="max-width:1100px;margin:30px auto"></div><button id="logout" class="btn secondary">Logout</button></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,onSnapshot,doc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const c={apiKey:"AIzaSyB9g0b9RzqYQvVhZ9dVQ0g7jKx2bYx2u0",authDomain:"smart-cool-6f513.firebaseapp.com",projectId:"smart-cool-6f513",storageBucket:"smart-cool-6f513.firebasestorage.app",messagingSenderId:"10468224529",appId:"1:10468224529:web:51026a5b4ac67a4ad40bb0"};const app=initializeApp(c),auth=getAuth(app),db=getFirestore(app);const $=x=>document.getElementById(x);$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("pass").value)}catch(e){$("msg").textContent=e.message}};$("logout").onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}else{$("login").classList.remove("hidden");$("dash").classList.add("hidden")}});function load(){onSnapshot(collection(db,"serviceRequests"),snap=>{let p=0,c=0;let html="";snap.forEach(x=>{const d=x.data();if(d.status==="pending")p++;if(d.status==="completed")c++;html+=`<div class="glass-card" style="margin:12px 0"><h3>${d.bookingId||x.id}</h3><p>${d.customerName||""} • ${d.customerPhone||""}</p><p>${d.service||""} • ${d.area||""}</p><p>${d.address||""}</p><p>${d.problem||""}</p><select data-id="${x.id}" class="status"><option ${d.status==="pending"?"selected":""}>pending</option><option ${d.status==="in progress"?"selected":""}>in progress</option><option ${d.status==="completed"?"selected":""}>completed</option><option ${d.status==="cancelled"?"selected":""}>cancelled</option></select> <button class="btn secondary del" data-id="${x.id}">Delete</button></div>`});$("requests").innerHTML=html||"<div class='glass-card'>No requests yet.</div>";$("total").textContent=snap.size;$("pending").textContent=p;$("completed").textContent=c;document.querySelectorAll(".status").forEach(s=>s.onchange=()=>updateDoc(doc(db,"serviceRequests",s.dataset.id),{status:s.value}));document.querySelectorAll(".del").forEach(b=>b.onclick=()=>confirm("Delete request?")&&deleteDoc(doc(db,"serviceRequests",b.dataset.id)))});}
</script></body></html>
