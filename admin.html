<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Cool & Refrigerator - Admin</title>

<meta name="description" content="Smart Cool & Refrigerator Admin Dashboard">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1d2939;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#007bff,#00b4d8);
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    padding:35px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:70px;
    height:70px;
    margin:0 auto 12px;
    border-radius:50%;
    background:#007bff;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

.logo h1{
    color:#007bff;
    font-size:24px;
}

.logo p{
    color:#667085;
    margin-top:5px;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
    font-size:14px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:13px 14px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    outline:none;
    font-size:15px;
    background:#fff;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#007bff;
    box-shadow:0 0 0 3px rgba(0,123,255,.1);
}

.login-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:9px;
    background:#007bff;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#0069d9;
}

.login-error{
    color:#d92d20;
    background:#fef3f2;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
    display:none;
}

/* ADMIN */

.admin-page{
    min-height:100vh;
}

.topbar{
    background:#fff;
    border-bottom:1px solid #eaecf0;
    padding:15px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand h1{
    color:#007bff;
    font-size:22px;
}

.brand p{
    font-size:12px;
    color:#667085;
    margin-top:3px;
}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.top-btn{
    border:0;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.refresh-btn{
    background:#eaf4ff;
    color:#007bff;
}

.logout-btn{
    background:#fff0ef;
    color:#d92d20;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:25px 18px 50px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#fff;
    border:1px solid #eaecf0;
    border-radius:14px;
    padding:20px;
}

.stat-card .label{
    color:#667085;
    font-size:13px;
    margin-bottom:8px;
}

.stat-card .number{
    font-size:28px;
    font-weight:800;
    color:#101828;
}

/* TOOLBAR */

.toolbar{
    background:#fff;
    border:1px solid #eaecf0;
    border-radius:14px;
    padding:15px;
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:220px;
}

.search-box input,
.filter-select{
    width:100%;
    padding:11px 13px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    outline:none;
    background:#fff;
}

.filter-select{
    width:190px;
}

/* BOOKINGS */

.bookings{
    display:grid;
    gap:16px;
}

.empty{
    background:#fff;
    border:1px solid #eaecf0;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    color:#667085;
}

.booking-card{
    background:#fff;
    border:1px solid #eaecf0;
    border-radius:15px;
    padding:20px;
    box-shadow:0 3px 10px rgba(16,24,40,.04);
}

.booking-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.booking-header h3{
    font-size:18px;
    color:#101828;
}

.booking-date{
    margin-top:6px;
    color:#667085;
    font-size:13px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
}

.status-pending{
    background:#fff4cc;
    color:#9a6700;
}

.status-confirmed{
    background:#e8f7ee;
    color:#087443;
}

.status-progress{
    background:#eaf4ff;
    color:#0066cc;
}

.status-completed{
    background:#e9f7ef;
    color:#087443;
}

.status-cancelled{
    background:#fff0ef;
    color:#b42318;
}

.booking-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px 20px;
    border-top:1px solid #eaecf0;
    padding-top:15px;
}

.info-item{
    padding:5px 0;
}

.info-label{
    color:#667085;
    font-size:12px;
    margin-bottom:4px;
}

.info-value{
    color:#101828;
    font-size:14px;
    font-weight:600;
    word-break:break-word;
}

.problem{
    grid-column:1/-1;
}

.booking-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #eaecf0;
}

.action-btn{
    border:0;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
}

.confirm-btn{
    background:#e8f7ee;
    color:#087443;
}

.progress-btn{
    background:#eaf4ff;
    color:#0066cc;
}

.complete-btn{
    background:#e7f8f0;
    color:#067647;
}

.cancel-btn{
    background:#fff0ef;
    color:#b42318;
}

.invoice-btn{
    background:#f3e8ff;
    color:#7f22ce;
}

.delete-btn{
    background:#fee4e2;
    color:#b42318;
}

.whatsapp-btn{
    background:#e8f7ee;
    color:#087443;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(16,24,40,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal-box{
    width:100%;
    max-width:620px;
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:16px;
    padding:25px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.modal-header h2{
    color:#101828;
    font-size:21px;
}

.close-btn{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f2f4f7;
    cursor:pointer;
    font-size:18px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.modal-btn{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.save-btn{
    background:#007bff;
    color:#fff;
}

.print-btn{
    background:#f2f4f7;
    color:#344054;
}

.cancel-modal-btn{
    background:#fff0ef;
    color:#b42318;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px;
    color:#667085;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e5e7eb;
    border-top-color:#007bff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#101828;
    color:#fff;
    padding:13px 17px;
    border-radius:9px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    z-index:2000;
    display:none;
    max-width:330px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:800px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .booking-grid{
        grid-template-columns:1fr;
    }

    .problem{
        grid-column:auto;
    }
}

@media(max-width:600px){
    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .top-actions{
        width:100%;
    }

    .top-btn{
        flex:1;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-card .number{
        font-size:23px;
    }

    .booking-header{
        flex-direction:column;
    }

    .filter-select{
        width:100%;
    }

    .booking-card{
        padding:15px;
    }

    .booking-actions .action-btn{
        flex:1;
        min-width:120px;
    }

    .modal-box{
        padding:18px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">
            <div class="logo-icon">❄️</div>
            <h1>Smart Cool & Refrigerator</h1>
            <p>Admin Dashboard</p>
        </div>

        <div id="loginError" class="login-error"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Admin email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>


<!-- ADMIN PAGE -->

<div id="adminPage" class="admin-page hidden">

    <header class="topbar">

        <div class="brand">
            <h1>Smart Cool & Refrigerator</h1>
            <p>Admin Dashboard</p>
        </div>

        <div class="top-actions">

            <button
                class="top-btn refresh-btn"
                onclick="loadBookings()"
            >
                🔄 Refresh
            </button>

            <button
                class="top-btn logout-btn"
                onclick="logoutAdmin()"
            >
                🚪 Logout
            </button>

        </div>

    </header>


    <main class="container">

        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">
                <div class="label">Total Bookings</div>
                <div class="number" id="totalCount">0</div>
            </div>

            <div class="stat-card">
                <div class="label">Pending</div>
                <div class="number" id="pendingCount">0</div>
            </div>

            <div class="stat-card">
                <div class="label">Confirmed</div>
                <div class="number" id="confirmedCount">0</div>
            </div>

            <div class="stat-card">
                <div class="label">Completed</div>
                <div class="number" id="completedCount">0</div>
            </div>

        </div>


        <!-- SEARCH -->

        <div class="toolbar">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search customer, phone, tracking ID..."
                    oninput="renderBookings()"
                >
            </div>

            <select
                id="statusFilter"
                class="filter-select"
                onchange="renderBookings()"
            >
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>

        </div>


        <!-- BOOKINGS -->

        <div id="bookingsContainer" class="bookings">

            <div class="loading">
                <div class="spinner"></div>
                Loading bookings...
            </div>

        </div>

    </main>

</div>


<!-- INVOICE MODAL -->

<div id="invoiceModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2>🧾 Invoice</h2>

            <button
                type="button"
                class="close-btn"
                onclick="closeInvoiceModal()"
            >
                ×
            </button>

        </div>


        <form id="invoiceForm">

            <input
                type="hidden"
                id="invoiceBookingId"
            >


            <div class="form-group">

                <label>Customer Name</label>

                <input
                    type="text"
                    id="invoiceCustomer"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>Tracking ID</label>

                <input
                    type="text"
                    id="invoiceTracking"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>Invoice Amount (PKR)</label>

                <input
                    type="number"
                    id="invoiceAmount"
                    min="0"
                    placeholder="Enter amount"
                >

            </div>


            <div class="form-group">

                <label>Invoice Note</label>

                <textarea
                    id="invoiceNote"
                    rows="4"
                    placeholder="Enter invoice note..."
                ></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-btn cancel-modal-btn"
                    onclick="closeInvoiceModal()"
                >
                    Close
                </button>

                <button
                    type="button"
                    class="modal-btn print-btn"
                    onclick="printInvoice()"
                >
                    🖨️ Print Invoice
                </button>

                <button
                    type="submit"
                    class="modal-btn save-btn"
                >
                    💾 Save Invoice
                </button>

            </div>

        </form>

    </div>

</div>


<div id="toast" class="toast"></div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    orderBy,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyAvnAK6gje0ly5XtxNotNl_dJhEhJ9pSHg",

    authDomain: "smart-cool-6f513.firebaseapp.com",

    projectId: "smart-cool-6f513",

    storageBucket: "smart-cool-6f513.firebasestorage.app",

    messagingSenderId: "10468224529",

    appId: "1:10468224529:web:51026a5b4ac67a4ad40bb0",

    measurementId: "G-Y5SPBHP57C"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ADMIN EMAIL */

const ADMIN_EMAILS = [
    "qoutex798@gmail.com"
];


let allBookings = [];


/* ELEMENTS */

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");

const bookingsContainer =
    document.getElementById("bookingsContainer");


/* AUTH STATE */

onAuthStateChanged(auth, async (user) => {

    if(user){

        const email =
            (user.email || "").toLowerCase();

        if(!ADMIN_EMAILS.includes(email)){

            await signOut(auth);

            showLoginError(
                "This account is not authorized as admin."
            );

            return;
        }

        loginPage.classList.add("hidden");

        adminPage.classList.remove("hidden");

        await loadBookings();

    }else{

        loginPage.classList.remove("hidden");

        adminPage.classList.add("hidden");

    }

});


/* LOGIN */

loginForm.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();

        loginError.style.display = "none";

        const email =
            document.getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("loginPassword")
                .value;

        if(!ADMIN_EMAILS.includes(email)){

            showLoginError(
                "This email is not authorized."
            );

            return;
        }

        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }catch(error){

            console.error(error);

            showLoginError(
                getFirebaseError(error)
            );

        }

    }
);


/* LOGIN ERROR */

function showLoginError(message){

    loginError.textContent = message;

    loginError.style.display = "block";

}


/* FIREBASE ERROR */

function getFirebaseError(error){

    const code =
        error?.code || "";

    if(code.includes("invalid-credential")){
        return "Email or password is incorrect.";
    }

    if(code.includes("wrong-password")){
        return "Password is incorrect.";
    }

    if(code.includes("user-not-found")){
        return "Admin account not found.";
    }

    if(code.includes("too-many-requests")){
        return "Too many attempts. Please try again later.";
    }

    return error?.message ||
        "Login failed. Please try again.";

}


/* LOGOUT */

window.logoutAdmin = async function(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

};


/* LOAD BOOKINGS */

window.loadBookings = async function(){

    bookingsContainer.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading bookings...
        </div>
    `;

    try{

        const bookingsRef =
            collection(db, "serviceRequests");

        const q =
            query(
                bookingsRef,
                orderBy("createdAt", "desc")
            );

        const snapshot =
            await getDocs(q);

        allBookings = [];

        snapshot.forEach((item) => {

            allBookings.push({

                firestoreId: item.id,

                ...item.data()

            });

        });

        updateStats();

        renderBookings();

    }catch(error){

        console.error(
            "Load bookings error:",
            error
        );

        /*
          Fallback without orderBy in case
          createdAt is missing from an older booking.
        */

        try{

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "serviceRequests"
                    )
                );

            allBookings = [];

            snapshot.forEach((item) => {

                allBookings.push({

                    firestoreId: item.id,

                    ...item.data()

                });

            });

            allBookings.sort(
                (a,b) => getTimestampMs(b.createdAt)
                    - getTimestampMs(a.createdAt)
            );

            updateStats();

            renderBookings();

        }catch(error2){

            console.error(error2);

            bookingsContainer.innerHTML = `
                <div class="empty">
                    ❌ Unable to load bookings.
                    <br><br>
                    ${escapeHtml(
                        error2.message || "Unknown error"
                    )}
                </div>
            `;

        }

    }

};


/* RENDER */

window.renderBookings = function(){

    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const status =
        document.getElementById("statusFilter")
            .value;


    let filtered =
        allBookings.filter((booking) => {

            const currentStatus =
                normalizeStatus(
                    booking.status
                );

            if(
                status !== "all" &&
                currentStatus !== status
            ){

                return false;

            }


            if(!search){

                return true;

            }


            const text = [

                booking.customerName,

                booking.name,

                booking.phone,

                booking.mobile,

                booking.trackingId,

                booking.bookingId,

                booking.service,

                booking.serviceType,

                booking.problem,

                booking.address

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            return text.includes(search);

        });


    if(filtered.length === 0){

        bookingsContainer.innerHTML = `
            <div class="empty">
                📭 No bookings found.
            </div>
        `;

        return;

    }


    bookingsContainer.innerHTML =
        filtered
        .map(
            bookingCardHtml
        )
        .join("");

};


/* BOOKING CARD */

function bookingCardHtml(booking){

    const customerName =
        booking.customerName ||
        booking.name ||
        "Customer";


    const phone =
        booking.phone ||
        booking.mobile ||
        "Not provided";


    const service =
        booking.service ||
        booking.serviceType ||
        "Service";


    const problem =
        booking.problem ||
        booking.issue ||
        booking.message ||
        "Not provided";


    const address =
        booking.address ||
        booking.location ||
        "Not provided";


    const preferredDate =
        booking.preferredDate ||
        booking.date ||
        "Not provided";


    const preferredTime =
        booking.preferredTime ||
        booking.time ||
        "Not provided";


    const trackingId =
        booking.trackingId ||
        booking.trackingID ||
        "";


    /*
      IMPORTANT:
      Firestore document ID is NEVER displayed
      as Booking ID.

      If booking.bookingId exists but is exactly
      equal to the Firestore document ID, hide it.
    */

    const rawBookingId =
        booking.bookingId ||
        "";

    const validBookingId =
        rawBookingId &&
        rawBookingId !== booking.firestoreId
            ? rawBookingId
            : "";


    const status =
        normalizeStatus(
            booking.status
        );


    const statusText =

/* UPDATE STATUS */

window.updateBookingStatus = async function(
    firestoreId,
    newStatus
){

    const booking =
        allBookings.find(
            item =>
                item.firestoreId === firestoreId
        );


    if(!booking){

        showToast(
            "Booking not found."
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "serviceRequests",
                firestoreId
            ),
            {
                status:newStatus,
                updatedAt:serverTimestamp()
            }
        );


        booking.status =
            newStatus;


        updateStats();

        renderBookings();

        showToast(
            "Booking status updated."
        );


    }catch(error){

        console.error(error);

        showToast(
            "Status update failed."
        );

    }

};


/* DELETE */

window.deleteBooking = async function(
    firestoreId
){

    const booking =
        allBookings.find(
            item =>
                item.firestoreId === firestoreId
        );


    if(!booking){

        showToast(
            "Booking not found."
        );

        return;

    }


    const customerName =
        booking.customerName ||
        booking.name ||
        "this booking";


    const ok =
        confirm(
            `Delete booking for ${customerName}?`
        );


    if(!ok){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "serviceRequests",
                firestoreId
            )
        );


        allBookings =
            allBookings.filter(
                item =>
                    item.firestoreId !== firestoreId
            );


        updateStats();

        renderBookings();

        showToast(
            "Booking deleted."
        );


    }catch(error){

        console.error(error);

        showToast(
            "Delete failed."
        );

    }

};

/* SAVE INVOICE */

document.getElementById(
    "invoiceForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const firestoreId =
            document.getElementById(
                "invoiceBookingId"
            ).value;


        const amount =
            Number(
                document.getElementById(
                    "invoiceAmount"
                ).value || 0
            );


        const note =
            document.getElementById(
                "invoiceNote"
            ).value
            .trim();


        if(!firestoreId){

            showToast(
                "Booking not selected."
            );

            return;

        }


        try{

            await updateDoc(
                doc(
                    db,
                    "serviceRequests",
                    firestoreId
                ),
                {
                    invoiceAmount:amount,
                    invoiceNote:note,
                    invoiceUpdatedAt:serverTimestamp(),
                    updatedAt:serverTimestamp()
                }
            );


            const booking =
                allBookings.find(
                    item =>
                        item.firestoreId === firestoreId
                );


            if(booking){

                booking.invoiceAmount =
                    amount;

                booking.invoiceNote =
                    note;

            }


            renderBookings();

            closeInvoiceModal();

            showToast(
                "Invoice saved successfully."
            );


        }catch(error){

            console.error(error);

            showToast(
                "Invoice save failed."
            );

        }

    }
);

/* STATS */

function updateStats(){

    const total =
        allBookings.length;


    const pending =
        allBookings.filter(
            b =>
                normalizeStatus(b.status)
                === "pending"
        ).length;


    const confirmed =
        allBookings.filter(
            b =>
                normalizeStatus(b.status)
                === "confirmed"
        ).length;


    const completed =
        allBookings.filter(
            b =>
                normalizeStatus(b.status)
                === "completed"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent = total;


    document.getElementById(
        "pendingCount"
    ).textContent = pending;


    document.getElementById(
        "confirmedCount"
    ).textContent = confirmed;


    document.getElementById(
        "completedCount"
    ).textContent = completed;

}


/* STATUS NORMALIZE */

function normalizeStatus(status){

    if(!status){

        return "pending";

    }


    const value =
        String(status)
        .toLowerCase()
        .trim();


    if(
        value === "in progress" ||
        value === "in_progress" ||
        value === "progress"
    ){

        return "in-progress";

    }


    return value;

}


/* STATUS LABEL */

function statusLabel(status){

    const labels = {

        pending:"Pending",

        confirmed:"Confirmed",

        "in-progress":"In Progress",

        completed:"Completed",

        cancelled:"Cancelled"

    };


    return labels[status] ||
        "Pending";

}


/* STATUS CLASS */

function statusClass(status){

    if(
        [
            "pending",
            "confirmed",
            "progress",
            "completed",
            "cancelled"
        ].includes(status)
    ){

        if(status === "progress"){

            return "progress";

        }

        return status;

    }


    if(status === "in-progress"){

        return "progress";

    }


    return "pending";

}


/* DATE */

function formatDate(value){

    if(!value){

        return "Not provided";

    }


    try{

        let date;


        if(
            typeof value.toDate === "function"
        ){

            date =
                value.toDate();

        }else if(
            value.seconds
        ){

            date =
                new Date(
                    value.seconds * 1000
                );

        }else{

            date =
                new Date(value);

        }


        if(
            isNaN(date.getTime())
        ){

            return "Not provided";

        }


        return date.toLocaleString(
            "en-PK",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Not provided";

    }

}


/* TIMESTAMP */

function getTimestampMs(value){

    if(!value){

        return 0;

    }


    try{

        if(
            typeof value.toMillis === "function"
        ){

            return value.toMillis();

        }


        if(value.seconds){

            return value.seconds * 1000;

        }


        const date =
            new Date(value);


        return isNaN(date.getTime())
            ? 0
            : date.getTime();

    }catch(error){

        return 0;

    }

}


/* GENERATE CUSTOMER-FACING ID */

function generateDisplayId(booking){

    /*
      NEVER use Firestore document ID here.

      Prefer existing tracking ID.
      Otherwise generate a short display reference
      from the booking data.
    */

    if(
        booking.trackingId
    ){

        return booking.trackingId;

    }


    if(
        booking.trackingID
    ){

        return booking.trackingID;

    }


    const created =
        getTimestampMs(
            booking.createdAt
        );


    if(created){

        return (
            "SC-" +
            String(created)
            .slice(-8)
        );

    }


    return "SC-BOOKING";

}


/* MONEY */

function formatMoney(amount){

    return Number(
        amount || 0
    ).toLocaleString(
        "en-PK"
    );

}


/* ESCAPE HTML */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ESCAPE JS */

function escapeJs(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


/* TOAST */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =

    toast.style.display =

        setTimeout(
            () => {

                toast.style.display =

            3000
        );

}
