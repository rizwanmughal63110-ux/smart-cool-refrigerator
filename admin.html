<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

button,

textarea{

button{

.hidden{

/* LOGIN */

#loginPage{

  display:flex;

  justify-content:center;

.login-box{

  padding:35px;

.login-logo{

.login-box h1{

.login-box p{
  text-align:center;

  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
  font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  outline:none;
  font-size:15px;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,

}

.login-btn{

  padding:14px;
  border:0;

  background:#0284c7;
  color:#fff;
  font-weight:bold;

}

.login-btn:hover{

}

.login-error{

  padding:10px;
  border-radius:8px;
  background:#fee2e2;

  font-size:14px;

/* ADMIN */

.topbar{

.main{

/* STATS */

.stats-grid{

  gap:15px;
  margin-bottom:25px;
}

.stat-card{

  padding:20px;
  border-radius:15px;

}

.stat-card .label{

}

.stat-card .value{

/* TOOLBAR */

.toolbar{

/* MODAL */

.modal{

.modal.show{

.modal-box{

.modal-header h2{

.close-btn{

  border-radius:50%;
  font-size:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;

/* TOAST */

#toast{

  right:20px;
  bottom:20px;
  background:#0f172a;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:1000;
  max-width:350px;
}

#toast.show{
  transform:translateY(0);
  opacity:1;

  }

/* ================= GLOBAL DATA ================= */

/* ================= HELPERS ================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


function formatMoney(amount){

  return Number(amount || 0).toLocaleString("en-PK");

}


function getTimestampMs(value){

  if(!value) return 0;

  try{

    if(typeof value.toMillis === "function"){
      return value.toMillis();
    }

    if(value.seconds){
      return Number(value.seconds) * 1000;
    }

    if(value instanceof Date){
      return value.getTime();
    }

    const date = new Date(value);

    if(!isNaN(date.getTime())){
      return date.getTime();
    }

  }catch(error){

    console.log(error);

  }

  return 0;

}


function formatDate(value){

  const ms = getTimestampMs(value);

  if(!ms){
    return "N/A";
  }

  return new Date(ms).toLocaleString("en-PK",{
    dateStyle:"medium",
    timeStyle:"short"
  });

}


/* ================= STATUS ================= */

function normalizeStatus(status){

  if(!status){
    return "pending";
  }

  const value =
    String(status)
      .toLowerCase()
      .trim();


  if(
    value === "in progress" ||
    value === "in_progress" ||
    value === "progress"
  ){

    return "in-progress";

  }


  if(
    value === "cancel" ||
    value === "canceled" ||
    value === "rejected"
  ){

    return "cancelled";

  }


  return value;

}


function statusText(status){

  const value = normalizeStatus(status);

  if(value === "in-progress"){
    return "In Progress";
  }

  if(value === "cancelled"){
    return "Cancelled";
  }

  if(value === "confirmed"){
    return "Confirmed";
  }

  if(value === "completed"){
    return "Completed";
  }

  return "Pending";

}


function statusClass(status){

  const value = normalizeStatus(status);

  if(value === "in-progress"){
    return "status-in-progress";
  }

  if(value === "cancelled"){
    return "status-cancelled";
  }

  if(value === "confirmed"){
    return "status-confirmed";
  }

  if(value === "completed"){
    return "status-completed";
  }

  return "status-pending";

}


/* ================= PHONE ================= */

/*
  Customer phone number ko different possible
  Firebase field names se find karega.
*/

function getCustomerPhone(booking){

  return (

    booking?.phone ||

    booking?.mobile ||

    booking?.whatsapp ||

    booking?.whatsappNumber ||

    booking?.phoneNumber ||

    booking?.customerPhone ||

    booking?.contactNumber ||

    booking?.contact ||

    booking?.customerMobile ||

    booking?.customerWhatsapp ||

    ""

  );

}


/* ================= TRACKING ID ================= */

function generateDisplayId(booking){

  if(
    booking?.trackingId &&
    booking.trackingId !== booking.firestoreId
  ){

    return booking.trackingId;

  }


  if(
    booking?.trackingID &&
    booking.trackingID !== booking.firestoreId
  ){

    return booking.trackingID;

  }


  const created =
    getTimestampMs(booking?.createdAt);


  if(created){

    return "SC-" + String(created).slice(-8);

  }


  return "SC-BOOKING";

}


/* ================= BOOKING ID ================= */

function getBookingId(booking){

  const rawBookingId =
    booking?.bookingId || "";

  if(
    rawBookingId &&
    rawBookingId !== booking.firestoreId
  ){

    return rawBookingId;

  }

  return "";

}


/* ================= AMOUNT ================= */

function getInvoiceAmount(booking){

  const possibleValues = [

    booking?.invoiceAmount,

    booking?.totalAmount,

    booking?.amount,

    booking?.price

  ];


  for(const value of possibleValues){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      const number =
        Number(
          String(value)
            .replace(/,/g,"")
            .replace(/[^\d.-]/g,"")
        );


      if(
        !isNaN(number) &&
        number > 0
      ){

        return number;

      }

    }

  }


  return 0;

}


/* ================= PAYMENT ================= */

function getPaymentStatus(booking){

  const value =
    String(
      booking?.paymentStatus ||
      booking?.payment ||
      "unpaid"
    )
    .toLowerCase()
    .trim();


  return value === "paid"
    ? "paid"
    : "unpaid";

}


/* ================= TOAST ================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");


  setTimeout(()=>{

    toast.classList.remove("show");

  },3000);

}

  const password =
    document
      .getElementById("loginPassword")

  const errorBox =
    document.getElementById("loginError");


  errorBox.style.display = "none";


  if(!email || !password){

    errorBox.textContent =

    return;

  }


  if(!ADMIN_EMAILS.includes(email)){

    errorBox.textContent =
      "This email is not authorized as admin.";

    errorBox.style.display = "block";

    return;

  }


  try{

    await signInWithEmailAndPassword(

      email,
      password
    );

  }catch(error){

    console.error(error);

    errorBox.textContent =
      error.message ||

/* ================= LOAD BOOKINGS ================= */

window.loadRequests = async function(){

  const container =
    document.getElementById(
      "bookingsContainer"
    );


  container.innerHTML = `
    <div class="empty">
      Loading bookings...
    </div>
  `;


  try{

    const q =
      query(
        collection(
          db,
          "serviceRequests"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    allBookings =
      snapshot.docs.map(item =>({

        firestoreId:item.id,

        ...item.data()

      }));


    updateStats();

    renderBookings();


  }catch(error){

    console.error(error);


    container.innerHTML = `
      <div class="empty">
        <h3>Unable to load bookings</h3>
        <p style="margin-top:8px">
          ${escapeHtml(error.message)}
        </p>
      </div>
    `;

  }

};


/* ================= STATS ================= */

function updateStats(){

  const total =
    allBookings.length;


  const pending =
    allBookings.filter(
      b =>
        normalizeStatus(b.status)
        === "pending"
    ).length;


  const confirmed =
    allBookings.filter(
      b =>
        normalizeStatus(b.status)
        === "confirmed"
    ).length;


  const completed =
    allBookings.filter(
      b =>
        normalizeStatus(b.status)
        === "completed"
    ).length;


  const totalAmount =
    allBookings.reduce(
      (sum,b) =>
        sum + getInvoiceAmount(b),
      0
    );


  const paidAmount =
    allBookings.reduce(
      (sum,b) => {

        if(
          getPaymentStatus(b)
          === "paid"
        ){

          return sum +
            getInvoiceAmount(b);

        }

        return sum;

      },
      0
    );


  document
    .getElementById("totalCount")
    .textContent = total;


  document
    .getElementById("pendingCount")
    .textContent = pending;


  document
    .getElementById("confirmedCount")
    .textContent = confirmed;


  document
    .getElementById("completedCount")
    .textContent = completed;


  document
    .getElementById("totalAmount")
    .textContent =
      "PKR " +
      formatMoney(totalAmount);


  document
    .getElementById("paidAmount")
    .textContent =
      "PKR " +
      formatMoney(paidAmount);

}


/* ================= RENDER BOOKINGS ================= */

window.renderBookings = function(){

  const container =
    document.getElementById(
      "bookingsContainer"
    );


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const filter =
    document
      .getElementById("statusFilter")
      .value;


  const filtered =
    allBookings.filter(booking => {

      const customerName =
        booking.customerName ||
        booking.name ||
        "";


      const phone =
        getCustomerPhone(booking);


      const trackingId =
        generateDisplayId(booking);


      const bookingId =
        getBookingId(booking);


      const service =
        booking.service ||
        booking.serviceType ||
        "";


      const searchText =
        (
          customerName +
          " " +
          phone +
          " " +
          trackingId +
          " " +
          bookingId +
          " " +
          service
        )
        .toLowerCase();


      const matchesSearch =
        !search ||
        searchText.includes(search);


      const matchesStatus =
        filter === "all" ||
        normalizeStatus(
          booking.status
        ) === filter;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        <h3>No bookings found</h3>
        <p style="margin-top:7px">
          Try changing your search or filter.
        </p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(createBookingCard)
      .join("");

};

/* ================= STATUS UPDATE ================= */

window.updateBookingStatus =
async function(
  firestoreId,
  newStatus
){

  const booking =
    allBookings.find(
      item =>
        item.firestoreId === firestoreId
    );


  if(!booking){

    showToast(
      "Booking not found."
    );

    return;

  }


  /*
    WhatsApp tab pehle open kar rahe hain
    taake browser popup blocker na lagaye.
  */

  let waWindow = null;


  try{

    waWindow =
      window.open(
        "about:blank",
        "_blank"
      );

  }catch(error){

    console.log(error);

  }


  try{

    await updateDoc(

      doc(
        db,
        "serviceRequests",
        firestoreId
      ),

      {
        status:newStatus,

        updatedAt:
          serverTimestamp()

      }

    );


    booking.status =
      newStatus;


    updateStats();

    renderBookings();


    const customerName =
      booking.customerName ||
      booking.name ||
      "Customer";


    const phone =
      getCustomerPhone(booking);


    const trackingId =
      generateDisplayId(booking);


    /*
      Status-specific WhatsApp message
      + Tracking ID
      + Tracking page link
    */

    const message =
      getStatusMessage(
        newStatus,
        customerName,
        trackingId
      );


    if(phone){

      let cleanPhone =
        String(phone)
          .replace(/\D/g,"");


      /*
        Pakistan number:
        03001234567
        becomes:
        923001234567
      */

      if(
        cleanPhone.startsWith("0")
      ){

        cleanPhone =
          "92" +
          cleanPhone.substring(1);

      }


      /*
        If number doesn't start with
        Pakistan country code.
      */

      if(
        !cleanPhone.startsWith("92")
      ){

        cleanPhone =
          "92" +
          cleanPhone;

      }


      const whatsappUrl =
        "https://wa.me/" +
        cleanPhone +
        "?text=" +
        encodeURIComponent(message);


      if(waWindow){

        waWindow.location.href =
          whatsappUrl;

      }else{

        window.open(
          whatsappUrl,
          "_blank"
        );

      }


      showToast(
        "Status updated. WhatsApp message is ready."
      );

    }else{

      /*
        Number missing ho to status update
        phir bhi Firebase mein save ho jayega.
      */

      if(waWindow){

        waWindow.close();

      }


      showToast(
        "Status updated, but customer WhatsApp number was not found."
      );

    }

  }catch(error){

    console.error(error);


    if(waWindow){

      waWindow.close();

    }


    showToast(
      "Status update failed: " +
      error.message
    );

  }

};

window.saveInvoice =
async function(){

  if(!currentInvoiceFirestoreId){

    showToast(
      "No booking selected."
    );

    return;

  }


  const amount =
    Number(
      document
        .getElementById("invoiceAmount")
        .value
    );


  const paymentStatus =
    document
      .getElementById(
        "invoicePaymentStatus"
      )
      .value;


  const note =
    document
      .getElementById(
        "invoiceNote"
      )
      .value
      .trim();


  if(
    isNaN(amount) ||
    amount < 0
  ){

    showToast(
      "Please enter a valid amount."
    );

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "serviceRequests",
        currentInvoiceFirestoreId
      ),

      {

        invoiceAmount:
          amount,

        paymentStatus:
          paymentStatus,

        invoiceNote:
          note,

        invoiceUpdatedAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );


    const booking =
      allBookings.find(
        item =>
          item.firestoreId ===
          currentInvoiceFirestoreId
      );


    if(booking){

      booking.invoiceAmount =
        amount;

      booking.paymentStatus =
        paymentStatus;

      booking.invoiceNote =
        note;

    }


    updateStats();

    closeInvoice();

    renderBookings();


    showToast(
      "Invoice saved successfully."
    );


  }catch(error){

    console.error(error);

    showToast(
      "Invoice save failed: " +
      error.message
    );

  }

};

/* ================= DELETE BOOKING ================= */

window.deleteBooking =
async function(firestoreId){

  const booking =
    allBookings.find(
      item =>
        item.firestoreId === firestoreId
    );


  if(!booking){

    showToast(
      "Booking not found."
    );

    return;

  }


  const customerName =
    booking.customerName ||
    booking.name ||
    "Customer";


  const confirmed =
    confirm(
      "Delete booking for " +
      customerName +
      "?\n\nThis action cannot be undone."
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "serviceRequests",
        firestoreId
      )

    );


    allBookings =
      allBookings.filter(
        item =>
          item.firestoreId !==
          firestoreId
      );


    updateStats();

    renderBookings();


    showToast(
      "Booking deleted successfully."
    );


  }catch(error){

    console.error(error);

    showToast(
      "Delete failed: " +
      error.message
    );

  }

};
