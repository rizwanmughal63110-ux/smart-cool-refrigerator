<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Cool | Admin Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#dffcff 0%,#f4f7fb 45%);
}

.login-card{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.10);
}

.login-logo{
    text-align:center;
    font-size:48px;
    margin-bottom:10px;
}

.login-card h1{
    text-align:center;
    font-size:25px;
    margin-bottom:5px;
}

.login-card .subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
    font-size:14px;
}

.login-group{
    margin-bottom:15px;
}

.login-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.login-group input{
    width:100%;
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

.login-group input:focus{
    border-color:#087f8c;
}

.login-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:9px;
    background:#087f8c;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#066b76;
}

.login-message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-size:13px;
}

.login-message.error{
    display:block;
    background:#fff1f2;
    color:#b42318;
}

.login-message.success{
    display:block;
    background:#ecfdf3;
    color:#16713a;
}


/* =========================
   APP
========================= */

#adminApp{
    display:none;
}


/* =========================
   TOPBAR
========================= */

.topbar{
    background:#087f8c;
    color:white;
    padding:16px 20px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    font-size:32px;
}

.logo h1{
    font-size:22px;
}

.logo span{
    font-size:12px;
    opacity:.9;
}

.top-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.home-btn,
.logout-btn{
    color:white;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.5);
    padding:9px 14px;
    border-radius:8px;
    font-size:14px;
    background:transparent;
    cursor:pointer;
}

.logout-btn:hover,
.home-btn:hover{
    background:rgba(255,255,255,.12);
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 18px 50px;
}

.page-title{
    margin-bottom:22px;
}

.page-title h2{
    font-size:28px;
    margin-bottom:6px;
}

.page-title p{
    color:#667085;
}


/* =========================
   CONNECTION
========================= */

.connection{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
    font-size:13px;
}

.connection-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#12b76a;
}

.connection.offline .connection-dot{
    background:#f04438;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    border-left:5px solid #087f8c;
}

.stat-card h3{
    font-size:28px;
    margin-bottom:5px;
}

.stat-card p{
    color:#667085;
    font-size:14px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:white;
    padding:16px;
    border-radius:14px;
    margin-bottom:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.search-box{
    flex:1;
    min-width:220px;
}

.search-box input,
.filter select{
    width:100%;
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.search-box input:focus,
.filter select:focus{
    border-color:#087f8c;
}

.refresh-btn{
    border:0;
    padding:12px 16px;
    border-radius:8px;
    background:#087f8c;
    color:white;
    cursor:pointer;
    font-weight:bold;
}


/* =========================
   BOOKINGS
========================= */

.bookings{
    display:grid;
    gap:18px;
}

.booking-card{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    border-left:5px solid #087f8c;
}

.booking-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:15px;
}

.booking-id{
    font-size:18px;
    font-weight:bold;
    color:#087f8c;
}

.booking-date{
    color:#667085;
    font-size:13px;
    margin-top:5px;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status-Pending{
    background:#fff4cc;
    color:#946200;
}

.status-Confirmed{
    background:#dff4ff;
    color:#006b8f;
}

.status-InProgress{
    background:#e0e7ff;
    color:#3730a3;
}

.status-Completed{
    background:#dcfce7;
    color:#16713a;
}

.status-Cancelled{
    background:#fee2e2;
    color:#b42318;
}

.booking-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:15px;
}

.info-box{
    background:#f8fafc;
    padding:12px;
    border-radius:8px;
}

.info-box small{
    display:block;
    color:#667085;
    font-size:11px;
    margin-bottom:4px;
    text-transform:uppercase;
}

.info-box strong{
    font-size:14px;
    word-break:break-word;
}

.problem{
    background:#f8fafc;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
}

.problem small{
    color:#667085;
    display:block;
    margin-bottom:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.actions select{
    padding:9px;
    border:1px solid #d0d5dd;
    border-radius:7px;
    background:white;
}

.btn{
    border:0;
    padding:9px 13px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.whatsapp-btn{
    background:#dcfce7;
    color:#16713a;
}

.delete-btn{
    background:#fee2e2;
    color:#b42318;
}

.invoice-btn{
    background:#e0e7ff;
    color:#3730a3;
}

.amount{
    color:#087f8c;
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;
    padding:45px 20px;
    text-align:center;
    border-radius:14px;
    color:#667085;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}


/* =========================
   LOADING
========================= */

.loading{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:14px;
    color:#667085;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.active{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:16px;
    padding:25px;
}

.modal-card h2{
    margin-bottom:18px;
}

.modal-group{
    margin-bottom:14px;
}

.modal-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.modal-group input,
.modal-group textarea{
    width:100%;
    padding:11px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:14px;
}

.modal-group textarea{
    min-height:90px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.save-btn{
    flex:1;
    border:0;
    background:#087f8c;
    color:white;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.close-btn{
    border:0;
    background:#eaecf0;
    color:#344054;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#172033;
    color:white;
    padding:13px 17px;
    border-radius:9px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:none;
    z-index:10000;
    font-size:14px;
}

.toast.show{
    display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .booking-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .topbar-inner{
        align-items:flex-start;
    }

    .logo h1{
        font-size:18px;
    }

    .home-btn,
    .logout-btn{
        font-size:12px;
        padding:8px 10px;
    }

    .container{
        padding:20px 12px 40px;
    }

    .page-title h2{
        font-size:23px;
    }

    .stats{
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-card h3{
        font-size:23px;
    }

    .booking-top{
        flex-direction:column;
    }

    .top-actions{
        flex-direction:column;
        align-items:stretch;
    }

}

</style>

</head>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAvnAK6gje0ly5XtxNotNl_dJhEhJ9pSHg",
  authDomain: "smart-cool-6f513.firebaseapp.com",
  projectId: "smart-cool-6f513",
  storageBucket: "smart-cool-6f513.firebasestorage.app",
  messagingSenderId: "10468224529",
  appId: "1:10468224529:web:51026a5b4ac67a4ad40bb0",
  measurementId: "G-Y5SPBHP57C"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   ADMIN EMAIL SECURITY
=====================================================

   IMPORTANT:
   Yahan apna ADMIN EMAIL add karein.

   Example:

   const ADMIN_EMAILS = [
       "your-admin-email@gmail.com"
   ];

===================================================== */

const ADMIN_EMAILS = [

    "YOUR_ADMIN_EMAIL@gmail.com"

];


/* =====================================================
   GLOBAL DATA
===================================================== */

let allBookings = [];


/* =====================================================
   DOM
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const adminApp =
    document.getElementById("adminApp");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const searchInput =
    document.getElementById("searchInput");

const statusFilter =
    document.getElementById("statusFilter");

const refreshBtn =
    document.getElementById("refreshBtn");

const bookingsContainer =
    document.getElementById("bookingsContainer");


/* =====================================================
   LOGIN MESSAGE
===================================================== */

function showLoginMessage(message, type = "error"){

    loginMessage.textContent =
        message;

    loginMessage.className =
        "login-message " + type;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const loggedInEmail =
                result.user.email
                    .toLowerCase();


            if(
                ADMIN_EMAILS.length > 0 &&
                !ADMIN_EMAILS.includes(loggedInEmail)
            ){

                await signOut(auth);

                throw new Error(
                    "This account is not authorized as admin."
                );

            }


            showLoginMessage(
                "Login successful.",
                "success"
            );


        }catch(error){

            console.error(error);


            let message =
                "Login failed. Email ya password check karein.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "Email ya password incorrect hai.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "Too many attempts. Thori der baad try karein.";

            }

            else if(
                error.message.includes(
                    "not authorized"
                )
            ){

                message =
                    "Ye account Admin account nahi hai.";

            }


            showLoginMessage(
                message,
                "error"
            );

        }


        loginBtn.disabled = false;

        loginBtn.textContent =
            "Login to Dashboard";

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            loginScreen.style.display =
                "flex";

            adminApp.style.display =
                "none";

            return;

        }


        const email =
            (user.email || "").toLowerCase();


        if(
            ADMIN_EMAILS.length > 0 &&
            !ADMIN_EMAILS.includes(email)
        ){

            await signOut(auth);

            return;

        }


        loginScreen.style.display =
            "none";

        adminApp.style.display =
            "block";


        await loadBookings();

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

        }catch(error){

            console.error(error);

        }

    }
);


/* =====================================================
   LOAD BOOKINGS FROM FIRESTORE
===================================================== */

async function loadBookings(){

    bookingsContainer.innerHTML = `
        <div class="loading">
            🔄 Loading bookings from Firebase...
        </div>
    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "serviceRequests"
                )
            );


        allBookings = [];


        snapshot.forEach(function(item){

            allBookings.push({

                firestoreId:
                    item.id,

                ...item.data()

            });

        });


        /* NEWEST FIRST */

        allBookings.sort(
            function(a,b){

                return getTimestampMillis(b.createdAt)
                     - getTimestampMillis(a.createdAt);

            }
        );


        setConnection(true);

        renderBookings();


    }catch(error){

        console.error(
            "Firebase booking error:",
            error
        );


        setConnection(false);


        bookingsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampMillis(timestamp){

    if(!timestamp){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    if(
        timestamp.seconds !== undefined
    ){

        return timestamp.seconds * 1000;

    }


    if(timestamp instanceof Date){

        return timestamp.getTime();

    }


    const date =
        new Date(timestamp);


    if(!isNaN(date.getTime())){

        return date.getTime();

    }


    return 0;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(date){

    const milliseconds =
        getTimestampMillis(date);


    if(!milliseconds){

        return "Unknown";

    }


    try{

        return new Date(
            milliseconds
        ).toLocaleString(
            "en-PK",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch(error){

        return "Unknown";

    }

}

/* =====================================================
   RENDER
===================================================== */

function renderBookings(){

    updateStats();


    const search =
        searchInput
            .value
            .toLowerCase()
            .trim();


    const filter =
        statusFilter.value;


    const filtered =
        allBookings.filter(
            function(booking){

                const searchable = [

                    booking.trackingId,

                    booking.bookingId,

                    booking.customerName,

                    booking.customerEmail,

                    booking.phone,

                    booking.service,

                    booking.area,

                    booking.address,

                    booking.problem

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                const matchesSearch =
                    searchable.includes(
                        search
                    );


                const matchesStatus =
                    filter === "All" ||
                    booking.status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    if(filtered.length === 0){

        bookingsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <h3>
                    No Bookings Found
                </h3>

                <p style="margin-top:8px;">
                    Customer bookings will appear
                    here after they submit a booking.
                </p>

            </div>

        `;

        return;

    }


    bookingsContainer.innerHTML =
        filtered
            .map(
                createBookingCard
            )
            .join("");

}

/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    if(status === "In Progress"){

        return "status-InProgress";

    }


    if(
        status === "Confirmed" ||
        status === "Completed" ||
        status === "Cancelled" ||
        status === "Pending"
    ){

        return "status-" +
            status.replace(
                /\s/g,
                ""
            );

    }


    return "status-Pending";

}


/* =====================================================
   CHANGE STATUS
===================================================== */

window.changeStatus =
async function(
    firestoreId,
    newStatus
){

    if(!firestoreId){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "serviceRequests",
                firestoreId
            ),
            {

                status:
                    newStatus,

                updatedAt:
                    serverTimestamp()

            }
        );


        const booking =
            allBookings.find(
                b =>
                    b.firestoreId ===
                    firestoreId
            );


        if(booking){

            booking.status =
                newStatus;

        }


        renderBookings();


        showToast(
            "Booking status updated successfully."
        );


    }catch(error){

        console.error(error);


        showToast(
            "Status update nahi ho saka."
        );

    }

};


/* =====================================================
   DELETE BOOKING
===================================================== */

window.deleteBooking =
async function(
    firestoreId
){

    if(!firestoreId){

        return;

    }


    const booking =
        allBookings.find(
            b =>
                b.firestoreId ===
                firestoreId
        );


    if(!booking){

        return;

    }


    const confirmDelete =
        confirm(
            "Kya aap is booking ko permanently delete karna chahte hain?\n\n" +
            "Tracking ID: " +
            (
                booking.trackingId ||
                "Unknown"
            )
        );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "serviceRequests",
                firestoreId
            )
        );


        allBookings =
            allBookings.filter(
                b =>
                    b.firestoreId !==
                    firestoreId
            );


        renderBookings();


        showToast(
            "Booking deleted successfully."
        );


    }catch(error){

        console.error(error);


        showToast(
            "Booking delete nahi ho saki."
        );

    }

};


/* =====================================================
   WHATSAPP
===================================================== */

window.openWhatsApp =
function(phone){

    let number =
        String(phone || "")
            .replace(
                /\D/g,
                ""
            );


    if(
        number.startsWith("03")
    ){

        number =
            "92" +
            number.substring(1);

    }


    if(!number){

        showToast(
            "Customer phone number available nahi hai."
        );

        return;

    }


    window.open(
        "https://wa.me/" +
        number,
        "_blank"
    );

};

/* =====================================================
   SAVE INVOICE
===================================================== */

document
    .getElementById("invoiceForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const firestoreId =
                document.getElementById(
                    "invoiceBookingId"
                ).value;


            const amount =
                Number(
                    document.getElementById(
                        "invoiceAmount"
                    ).value
                );


            const note =
                document.getElementById(
                    "invoiceNote"
                ).value
                .trim();


            if(!firestoreId){

                return;

            }


            if(
                isNaN(amount) ||
                amount < 0
            ){

                alert(
                    "Valid invoice amount enter karein."
                );

                return;

            }


            try{

                await updateDoc(

                    doc(
                        db,
                        "serviceRequests",
                        firestoreId
                    ),

                    {

                        invoiceAmount:
                            amount,

                        invoiceNote:
                            note,

                        invoiceUpdatedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }

                );


                const booking =
                    allBookings.find(
                        b =>
                            b.firestoreId ===
                            firestoreId
                    );


                if(booking){

                    booking.invoiceAmount =
                        amount;

                    booking.invoiceNote =
                        note;

                }


                closeInvoiceModal();

                renderBookings();


                showToast(
                    "Invoice amount saved successfully."
                );


            }catch(error){

                console.error(error);


                showToast(
                    "Invoice save nahi ho saka."
                );

            }

        }
    );

/* =====================================================

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}
