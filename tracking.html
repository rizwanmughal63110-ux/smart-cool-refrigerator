<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Booking - Smart Cool</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">❄</span><span><b>SMART COOL</b><small>& REFRIGERATOR</small></span></a></header><main class="section"><div class="section-head"><div class="eyebrow">BOOKING TRACKING</div><h2>Track Your <span>Service</span></h2><p>Enter your Tracking ID to view your service request.</p></div><div class="booking-card"><input id="bookingId" placeholder="e.g. TRK-12345678"><button id="trackBtn" class="btn primary full-btn">🔎 Track My Booking</button><p id="msg"></p><div id="result" class="glass-card hidden"></div></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,initializeAuth,indexedDBLocalPersistence,browserLocalPersistence,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,query,where,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const c={apiKey:"AIzaSyB9g0b9RzqYQvVhZ9dVQ0g7jKx2bYx2u0",authDomain:"smart-cool-6f513.firebaseapp.com",projectId:"smart-cool-6f513",storageBucket:"smart-cool-6f513.firebasestorage.app",messagingSenderId:"10468224529",appId:"1:10468224529:web:51026a5b4ac67a4ad40bb0"};const a=initializeApp(c);let auth;try{auth=initializeAuth(a,{persistence:[indexedDBLocalPersistence,browserLocalPersistence]})}catch(e){auth=getAuth(a)}const db=getFirestore(a);let user=null;onAuthStateChanged(auth,u=>user=u);document.getElementById("trackBtn").onclick=async()=>{const id=document.getElementById("bookingId").value.trim();const m=document.getElementById("msg");if(!user){m.textContent="Please login first from the main website.";return}if(!id){m.textContent="Enter Tracking ID.";return}m.textContent="Checking...";try{const q=query(collection(db,"serviceRequests"),where("trackingId","==",id),where("customerUid","==",user.uid),limit(1));const s=await getDocs(q);if(s.empty){m.textContent="Booking not found.";return}const d=s.docs[0].data();document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML=`<h3>Tracking ${d.trackingId||"—"}</h3><p><b>Booking ID:</b> ${d.bookingId||"—"}</p><p><b>Status:</b> ${d.status||"pending"}</p><p><b>Customer:</b> ${d.customerName}</p><p><b>Phone:</b> ${d.customerPhone}</p><p><b>Service:</b> ${d.service}</p><p><b>Area:</b> ${d.area}</p><p><b>Address:</b> ${d.address}</p><p><b>Problem:</b> ${d.problem}</p>`;m.textContent=""}catch(e){m.textContent=e.message}};</script></body></html>
