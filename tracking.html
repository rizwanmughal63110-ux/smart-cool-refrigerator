```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Booking | Smart Cool & Refrigerator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#0877d1;
  color:white;
  padding:18px;
  text-align:center;
}

header h2{
  margin:0;
}

.container{
  max-width:600px;
  margin:35px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.1);
  margin-bottom:20px;
}

h1{
  text-align:center;
  color:#0877d1;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  background:#0877d1;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#055fa8;
}

.hidden{
  display:none;
}

#debugBox{
  background:#111;
  color:#00ff66;
  padding:15px;
  border-radius:10px;
  font-family:monospace;
  font-size:13px;
  line-height:1.6;
  word-break:break-word;
}

.status{
  padding:15px;
  border-radius:8px;
  margin-top:15px;
  background:#eef5ff;
}

.booking-details{
  line-height:1.8;
}

.label{
  font-weight:bold;
  color:#0877d1;
}
</style>
</head>

<body>

<header>
  <h2>❄️ Smart Cool & Refrigerator</h2>
</header>

<div class="container">

  <div class="card">

    <h1>🔎 Track Your Booking</h1>

    <div id="loading">
      Checking your login...
    </div>

    <div id="loginRequired" class="hidden">
      <div class="status">
        🔐 <b>Login Required</b><br><br>
        Please login to your customer account before tracking your booking.
      </div>

      <br>

      <button onclick="window.location.href='index.html#account'">
        Login / Signup
      </button>
    </div>

    <div id="loggedIn" class="hidden">

      <div class="status">
        ✅ <b>Customer Logged In</b>
        <br>
        <span id="loggedUser"></span>
      </div>

      <br>

      <label>Enter your Booking ID</label>

      <input
        type="text"
        id="bookingId"
        placeholder="Example: BK-12345678"
      >

      <button id="trackBtn">
        🔎 Track Booking
      </button>

      <div id="result" class="status hidden"></div>

    </div>

  </div>


  <!-- DEBUG BOX -->

  <div class="card">

    <h3>🔧 Firebase Login Diagnostic</h3>

    <div id="debugBox">
      Starting Firebase...
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  limit,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyAvnAL6gje0ly5XtxNotNl_dJhEhJ9pSHg",
  authDomain: "smart-cool-6f513.firebaseapp.com",
  projectId: "smart-cool-6f513",
  storageBucket: "smart-cool-6f513.firebasestorage.app",
  messagingSenderId: "10468224529",
  appId: "1:10468224529:web:51026a5b4ac67a4ad40bb0",
  measurementId: "G-Y5SPBHP57C"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const debugBox = document.getElementById("debugBox");

const loading = document.getElementById("loading");

const loginRequired =
document.getElementById("loginRequired");

const loggedIn =
document.getElementById("loggedIn");

const loggedUser =
document.getElementById("loggedUser");


function debug(message){

  console.log(message);

  debugBox.innerHTML +=
    "<br>" + message;

}


/* BASIC INFORMATION */

debug("Page: " + window.location.href);

debug("Origin: " + window.location.origin);

debug("Firebase Project: " + firebaseConfig.projectId);


/* START AUTH */

async function startAuthentication(){

  try{

    debug("Setting browserLocalPersistence...");

    await setPersistence(
      auth,
      browserLocalPersistence
    );

    debug("Persistence: OK");

  }

  catch(error){

    debug(
      "Persistence ERROR: " +
      error.code
    );

    debug(
      "Message: " +
      error.message
    );

  }


  debug("Waiting for Firebase Auth...");


  onAuthStateChanged(
    auth,
    (user) => {

      loading.classList.add("hidden");


      if(user){

        debug("AUTH USER FOUND ✅");

        debug(
          "Email: " +
          user.email
        );

        debug(
          "UID: " +
          user.uid
        );


        loggedIn.classList.remove(
          "hidden"
        );

        loginRequired.classList.add(
          "hidden"
        );


        loggedUser.innerHTML =
          "Email: " +
          user.email;


      }else{

        debug("AUTH USER NOT FOUND ❌");

        debug(
          "Firebase currentUser = null"
        );


        loggedIn.classList.add(
          "hidden"
        );

        loginRequired.classList.remove(
          "hidden"
        );

      }

    }
  );

}


/* START */

startAuthentication();


/* TRACK BOOKING */

document
.getElementById("trackBtn")
.addEventListener(
  "click",
  async () => {

    const user = auth.currentUser;

    const bookingId =
      document
      .getElementById("bookingId")
      .value
      .trim();


    const result =
      document.getElementById("result");


    if(!user){

      result.classList.remove(
        "hidden"
      );

      result.innerHTML =
        "❌ You are not logged in.";

      return;

    }


    if(!bookingId){

      result.classList.remove(
        "hidden"
      );

      result.innerHTML =
        "⚠️ Please enter your Booking ID.";

      return;

    }


    result.classList.remove(
      "hidden"
    );

    result.innerHTML =
      "⏳ Searching booking...";


    try{

      const bookingQuery = query(

        collection(
          db,
          "serviceRequests"
        ),

        where(
          "bookingId",
          "==",
          bookingId
        ),

        where(
          "customerUid",
          "==",
          user.uid
        ),

        limit(1)

      );


      const snapshot =
        await getDocs(
          bookingQuery
        );


      if(snapshot.empty){

        result.innerHTML =
          "❌ Booking not found.";

        return;

      }


      const data =
        snapshot.docs[0].data();


      result.innerHTML = `

        <div class="booking-details">

          <div>
            <span class="label">
              Booking ID:
            </span>
            ${data.bookingId || ""}
          </div>

          <div>
            <span class="label">
              Status:
            </span>
            ${data.status || ""}
          </div>

          <div>
            <span class="label">
              Customer:
            </span>
            ${data.customerName || ""}
          </div>

          <div>
            <span class="label">
              Phone:
            </span>
            ${data.customerPhone || ""}
          </div>

          <div>
            <span class="label">
              Service:
            </span>
            ${data.service || ""}
          </div>

          <div>
            <span class="label">
              Area:
            </span>
            ${data.area || ""}
          </div>

          <div>
            <span class="label">
              Address:
            </span>
            ${data.address || ""}
          </div>

          <div>
            <span class="label">
              Problem:
            </span>
            ${data.problem || ""}
          </div>

        </div>

      `;

    }

    catch(error){

      console.error(error);

      result.innerHTML =
        "❌ Error: " +
        error.code +
        "<br>" +
        error.message;

    }

  }
);

</script>

</body>
</html>
```
