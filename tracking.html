<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Booking | Smart Cool & Refrigerator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#0877d1;
  color:white;
  padding:18px;
  text-align:center;
}

header h2{
  margin:0;
}

.container{
  max-width:600px;
  margin:35px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#0877d1;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  background:#0877d1;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#055fa8;
}

.hidden{
  display:none;
}

.status{
  padding:15px;
  border-radius:8px;
  margin-top:15px;
  background:#eef5ff;
}

.booking-details{
  line-height:1.9;
}

.label{
  font-weight:bold;
  color:#0877d1;
}

.success{
  background:#eaf8ee;
  border-left:5px solid #28a745;
}

.error{
  background:#fff0f0;
  border-left:5px solid #dc3545;
}
</style>
</head>

<body>

<header>
  <h2>❄️ Smart Cool & Refrigerator</h2>
</header>

<div class="container">

<div class="card">

<h1>🔎 Track Your Booking</h1>

<div id="loading">
  Checking your login...
</div>

<div id="loginRequired" class="hidden">

  <div class="status">
    🔐 <b>Login Required</b>
    <br><br>
    Please login to your customer account before tracking your booking.
  </div>

  <br>

  <button onclick="window.location.href='index.html#account'">
    Login / Signup
  </button>

</div>

<div id="loggedIn" class="hidden">

  <div class="status success">
    ✅ <b>Customer Logged In</b>
    <br>
    <span id="loggedUser"></span>
  </div>

  <br>

  <label><b>Enter your Booking ID</b></label>

  <input
    type="text"
    id="bookingId"
    placeholder="Example: BK-12345678"
  >

  <button id="trackBtn">
    🔎 Track Booking
  </button>

  <div id="result" class="status hidden"></div>

</div>

</div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  initializeAuth,
  indexedDBLocalPersistence,
  browserLocalPersistence,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  limit,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyAvnAL6gje0ly5XtxNotNl_dJhEhJ9pSHg",

  authDomain:
  "smart-cool-6f513.firebaseapp.com",

  projectId:
  "smart-cool-6f513",

  storageBucket:
  "smart-cool-6f513.firebasestorage.app",

  messagingSenderId:
  "10468224529",

  appId:
  "1:10468224529:web:51026a5b4ac67a4ad40bb0",

  measurementId:
  "G-Y5SPBHP57C"

};


/* FIREBASE */

const app = initializeApp(firebaseConfig);


/*
 IMPORTANT:
 Same authentication method as index.html
*/

const auth = initializeAuth(app, {

  persistence: [

    indexedDBLocalPersistence,

    browserLocalPersistence

  ]

});


const db = getFirestore(app);


/* ELEMENTS */

const loading =
document.getElementById("loading");

const loginRequired =
document.getElementById("loginRequired");

const loggedIn =
document.getElementById("loggedIn");

const loggedUser =
document.getElementById("loggedUser");

const result =
document.getElementById("result");


/* AUTH CHECK */

onAuthStateChanged(auth, (user) => {

  loading.classList.add("hidden");


  if(user){

    console.log("Logged in:", user.email);

    loggedIn.classList.remove("hidden");

    loginRequired.classList.add("hidden");

    loggedUser.innerHTML =
      "Email: " + user.email;

  }

  else{

    console.log("No logged-in user");

    loggedIn.classList.add("hidden");

    loginRequired.classList.remove("hidden");

  }

});


/* TRACK BOOKING */

document
.getElementById("trackBtn")
.addEventListener("click", async () => {


  const user = auth.currentUser;


  const bookingId =
    document
    .getElementById("bookingId")
    .value
    .trim()
    .toUpperCase();


  if(!user){

    result.className =
      "status error";

    result.innerHTML =
      "❌ Your login session was not found. Please login again.";

    return;

  }


  if(!bookingId){

    result.className =
      "status error";

    result.innerHTML =
      "⚠️ Please enter your Booking ID.";

    return;

  }


  result.className =
    "status";

  result.classList.remove("hidden");

  result.innerHTML =
    "⏳ Searching booking...";


  try{


    const bookingQuery = query(

      collection(
        db,
        "serviceRequests"
      ),

      where(
        "bookingId",
        "==",
        bookingId
      ),

      where(
        "customerUid",
        "==",
        user.uid
      ),

      limit(1)

    );


    const snapshot =
      await getDocs(
        bookingQuery
      );


    if(snapshot.empty){

      result.className =
        "status error";

      result.innerHTML = `
        ❌ <b>Booking not found.</b>
        <br><br>
        Please check your Booking ID.
      `;

      return;

    }


    const data =
      snapshot.docs[0].data();


    result.className =
      "status success";


    result.innerHTML = `

      <div class="booking-details">

        <div>
          <span class="label">
            Booking ID:
          </span>
          ${data.bookingId || "-"}
        </div>

        <div>
          <span class="label">
            Status:
          </span>
          ${data.status || "-"}
        </div>

        <div>
          <span class="label">
            Customer:
          </span>
          ${data.customerName || "-"}
        </div>

        <div>
          <span class="label">
            Phone:
          </span>
          ${data.customerPhone || "-"}
        </div>

        <div>
          <span class="label">
            Service:
          </span>
          ${data.service || "-"}
        </div>

        <div>
          <span class="label">
            Area:
          </span>
          ${data.area || "-"}
        </div>

        <div>
          <span class="label">
            Address:
          </span>
          ${data.address || "-"}
        </div>

        <div>
          <span class="label">
            Problem:
          </span>
          ${data.problem || "-"}
        </div>

      </div>

    `;

  }


  catch(error){

    console.error(error);

    result.className =
      "status error";

    result.innerHTML =
      "❌ Error: " +
      error.code +
      "<br>" +
      error.message;

  }

});

</script>

</body>
</html>
